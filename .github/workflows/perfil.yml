name: Actualizar panel del perfil

on:
  schedule:
    # Todos los dias a las 09:00 UTC (05:00 en Chile continental).
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install --quiet Pillow

      # Las cifras necesitan un PAT propio: el GITHUB_TOKEN del runner esta
      # limitado a este repo, asi que no puede ver los privados ni resolver
      # `viewer`. Si falta, se conservan las ultimas cifras ya guardadas.
      - name: Ver si hay PAT
        id: pat
        env:
          TOKEN: ${{ secrets.TOKEN_ESTADISTICAS }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secret TOKEN_ESTADISTICAS; se reutiliza assets/stats.json"
          fi

      - name: Recolectar estadisticas
        if: steps.pat.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ secrets.TOKEN_ESTADISTICAS }}
        run: |
          # A un archivo aparte: si el script falla, no se pierden las cifras
          # anteriores por el truncado que hace la redireccion.
          python scripts/stats.py > /tmp/stats.json
          mv /tmp/stats.json assets/stats.json

      - name: Regenerar el retrato ASCII
        run: |
          python scripts/ascii_art.py assets/retrato.jpg \
            --cols 46 --gamma 0.8 --local 6 --nitidez 180 \
            --recorte 250,40,900,940 --salida assets/retrato.txt > /dev/null

      - name: Regenerar los SVG
        run: python scripts/svg.py

      - name: Commitear si algo cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dark_mode.svg light_mode.svg assets/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar el panel del perfil"
            git push
          fi
